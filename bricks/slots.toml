# Slot order here IS the merge order for composed files. Changing it rewrites diffs.
[[slot]]
name = "container"
single = true

[[slot]]
name = "build"
single = true

[[slot]]
name = "web"
single = true

# CSS framework (Tailwind, etc.) — one per project.
[[slot]]
name = "css"
single = true

# Icon set (Iconify, etc.) — one per project.
[[slot]]
name = "icons"
single = true

# Linter (ESLint, etc.) — one per project.
[[slot]]
name = "lint"
single = true

# Formatter (Prettier, etc.) — one per project.
[[slot]]
name = "format"
single = true

# Type-checker (svelte-check / tsc) — one per project.
[[slot]]
name = "typecheck"
single = true

[[slot]]
name = "edge"
single = true

# Engines are mutually exclusive: at most one database engine per project.
[[slot]]
name = "db-engine"
single = true

# The ORM sits in its own single slot and selects its engine wiring via `when`.
[[slot]]
name = "orm"
single = true
