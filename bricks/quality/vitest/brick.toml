[brick]
name    = "vitest"
slot    = "test"
summary = "Vitest + jsdom test runner — agnostic base + gated Svelte/React component testing"

[requires]
build = "*"

[[files]]
from = "files/vitest.config.ts"
to   = "app/vitest.config.ts"

[[files]]
from = "files/vitest-setup.ts"
to   = "app/vitest-setup.ts"

[[files]]
from = "files/demo.test.ts"
to   = "app/src/demo.test.ts"

[[injection_points]]
name   = "vitest-plugins"
target = "app/vitest.config.ts"
marker = "stacky:vitest-plugins"

[[fragments]]
target   = "app/package.json"
from     = "fragments/package.json"
strategy = "json"

[[files]]
from = "files/Counter.svelte"
to   = "app/src/lib/Counter.svelte"
when = "svelte"
[[files]]
from = "files/Counter.svelte.test.ts"
to   = "app/src/lib/Counter.svelte.test.ts"
when = "svelte"

[[fragments]]
target   = "app/package.json"
from     = "fragments/package.svelte.json"
strategy = "json"
when     = "svelte"

[[inject]]
point = "vitest-plugins"
from  = "fragments/plugin.svelte.js"
when  = "svelte"

[[files]]
from = "files/Counter.tsx"
to   = "app/src/lib/Counter.tsx"
when = "react"
[[files]]
from = "files/Counter.test.tsx"
to   = "app/src/lib/Counter.test.tsx"
when = "react"

[[fragments]]
target   = "app/package.json"
from     = "fragments/package.react.json"
strategy = "json"
when     = "react"
