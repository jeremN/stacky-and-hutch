[brick]
name    = "prettier"
slot    = "format"
summary = "Prettier — framework-agnostic base + gated Svelte plugin"

[[files]]
from = "files/prettier.config.mjs"
to   = "app/prettier.config.mjs"

[[injection_points]]
name   = "prettier-plugins"
target = "app/prettier.config.mjs"
marker = "stacky:prettier-plugins"

[[fragments]]
target   = "app/package.json"
from     = "fragments/package.json"
strategy = "json"

[[fragments]]
target   = "app/package.json"
from     = "fragments/package.svelte.json"
strategy = "json"
when     = "svelte"

[[inject]]
point = "prettier-plugins"
from  = "fragments/plugin.svelte.js"
when  = "svelte"
