[brick]
name    = "tanstack-start"
slot    = "web"
summary = "TanStack Start (React) app layered on the Vite base"

[requires]
build = "*"

[provides]
capabilities = ["http-origin", "react"]

[[files]]
from = "files/server.ts"
to   = "app/src/server.ts"

[[files]]
from = "files/__root.tsx"
to   = "app/src/routes/__root.tsx"

[[files]]
from = "files/index.tsx"
to   = "app/src/routes/index.tsx"

[[files]]
from = "files/tsconfig.json"
to   = "app/tsconfig.json"

[[fragments]]
target   = "app/package.json"
from     = "fragments/package.json"
strategy = "json"

[[injection_points]]
name   = "server-init"
target = "app/src/server.ts"
marker = "stacky:server-init"

[[injection_points]]
name   = "app-head"
target = "app/src/routes/__root.tsx"
marker = "stacky:app-head"

[[injection_points]]
name   = "app-shell"
target = "app/src/routes/__root.tsx"
marker = "stacky:app-shell"

[[inject]]
point = "vite-plugins"
from  = "fragments/plugin.ts"
