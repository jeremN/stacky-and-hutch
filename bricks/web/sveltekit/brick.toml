[brick]
name    = "sveltekit"
slot    = "web"
summary = "SvelteKit app layered on the Vite base"

[requires]
build = "*"

[provides]
capabilities = ["http-origin", "svelte"]

[[files]]
from = "files/hooks.server.ts"
to   = "app/src/hooks.server.ts"

[[files]]
from = "files/+layout.svelte"
to   = "app/src/routes/+layout.svelte"

[[files]]
from = "files/+page.svelte"
to   = "app/src/routes/+page.svelte"

[[files]]
from = "files/tsconfig.json"
to   = "app/tsconfig.json"

[[files]]
from = "files/svelte.config.js"
to   = "app/svelte.config.js"

[[files]]
from = "files/app.html"
to   = "app/src/app.html"

[[files]]
from = "files/app.d.ts"
to   = "app/src/app.d.ts"

[[fragments]]
target   = "app/package.json"
from     = "fragments/package.json"
strategy = "json"

[[injection_points]]
name   = "server-init"
target = "app/src/hooks.server.ts"
marker = "stacky:server-init"

[[injection_points]]
name   = "app-head"
target = "app/src/routes/+layout.svelte"
marker = "stacky:app-head"

[[injection_points]]
name   = "app-shell"
target = "app/src/routes/+layout.svelte"
marker = "stacky:app-shell"

[[inject]]
point = "vite-plugins"
from  = "fragments/plugin.ts"
